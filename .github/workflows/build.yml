name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/XPERIENCE-v${VERSION_NAME}.apk
          SIZE=$(stat -c%s out/XPERIENCE-v${VERSION_NAME}.apk)
          cat > out/version.json <<JSON
          {
            "app": "XPERIENCE",
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apk": "https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/XPERIENCE-v${VERSION_NAME}.apk",
            "size": ${SIZE},
            "commit": "${{ github.sha }}"
          }
          JSON

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPERIENCE-v${{ env.VERSION_NAME }}
          path: out/*

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: XPERIENCE v${{ env.VERSION_NAME }}
          body: |
            APK automatik dari commit ${{ github.sha }}.
            Muat turun `XPERIENCE-v${{ env.VERSION_NAME }}.apk` dan pasang di telefon (Android 8.0+).
          files: |
            out/*.apk
            out/version.json
          make_latest: true
